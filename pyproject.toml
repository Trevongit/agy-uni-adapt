[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uatp"
version = "1.0.0-alpha"
description = "Universal Agent Translator Protocol (UATP) - Ultra-low-overhead translation layer bridging workspace agents and native LLM APIs"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "UATP Contributors" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "jsonschema>=4.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]
